[production]
# ansible_host=192.168.56.10: the VM's static host-only network IP.
# This bypasses VirtualBox NAT entirely, so Docker containers can reach the VM
# directly without port-forwarding or netsh proxy workarounds.
# Requires: config.vm.network "private_network", ip: "192.168.56.10" in Vagrantfile
# and vagrant reload to apply the new adapter if the VM is already running.
petclinic-prod ansible_host=192.168.56.10 ansible_port=22 ansible_user=vagrant ansible_ssh_private_key_file=/run/secrets/vagrant_private_key
