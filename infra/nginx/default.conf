server {
    listen 80;
    server_name _;

    # Increase a bit for the app's larger responses.
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    location / {
        # Send ALL upstream traffic THROUGH the ZAP proxy so it is passively
        # scanned. ZAP has no native reverse-proxy mode, but it transparently
        # forwards origin-form requests using the Host header - so we point Host
        # at the real backend (the app) and ZAP forwards there after scanning.
        proxy_pass http://zap-monitor:8090;
        proxy_http_version 1.1;

        # This Host is what ZAP uses to pick the backend to forward to.
        proxy_set_header Host app:8080;

        # Preserve client info for logs / the app.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep backend redirects pointing at the front door, not the internal host.
        proxy_redirect http://app:8080/ /;
    }
}
